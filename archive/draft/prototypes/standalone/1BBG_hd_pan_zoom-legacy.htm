<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
	<meta name="viewport"
	      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>VN Background</title>
<style>
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}
	html, body {
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #000;
	}
.background {
	position: fixed;
	inset: 0;
	transform-origin: 0 0;
	will-change: transform;
	pointer-events: none;
}
#bg_hd {
	z-index: 2;
}
	
	button {
		position: fixed;
		bottom: 20px;
		right: 20px;
		z-index: 10;
	}
</style>

</head>
<body>
<img id="bg" class="background" src="1.png">
<img id="bg_hd" class="background">

<button onclick="next_img()">Next</button>


<script>

	var originals = {
		'1.png': { x: 512, y: 256, w: 768, h: 1024, hd: '2.png' },
		'2.png': { x: 173, y: 182, w: 610, h: 610 }
	};

	var view = {
		scale: 1,
		min_scale: 1,
		max_scale: 4,
		x: 0,
		y: 0
	};

	var pointers = [];
	var last_dist = 0;
	
	
	var img_list = Object.keys(originals);
	var current_idx = 0;

	var img = document.getElementById('bg');
	var img_hd = document.getElementById('bg_hd');

	function fit_background() {
		if (!img.naturalWidth) return;

		var src = img.src.split('/').pop();
		var o = originals[src];
		if (!o) return;

		var vw = document.documentElement.clientWidth;
		var vh = document.documentElement.clientHeight;

	var base_scale = Math.min(vw / o.w, vh / o.h);
	view.min_scale = base_scale;
	var scale = base_scale * view.scale;

		var bw = img.naturalWidth * scale;
		var bh = img.naturalHeight * scale;

		var tx = vw * 0.5 - (o.x + o.w * 0.5) * scale;
		var ty = vh * 0.5 - (o.y + o.h * 0.5) * scale;

		if (bw > vw) tx = Math.min(0, Math.max(vw - bw, tx));
		else tx = (vw - bw) * 0.5;

		if (bh > vh) ty = Math.min(0, Math.max(vh - bh, ty));
		else ty = (vh - bh) * 0.5;

		img.style.width = bw + 'px';
		img.style.height = bh + 'px';
	img.style.transform =
		'translate(' + (tx + view.x) + 'px,' + (ty + view.y) + 'px)';

		// ---- HD overlay ----
		if (!o.hd) {
			img_hd.style.display = 'none';
			return;
		}

		if (img_hd.src.indexOf(o.hd) === -1) {
			img_hd.src = o.hd;
		}

		if (!img_hd.naturalWidth) return;

		var hw = o.w * scale;
		var hh = o.h * scale;

		var hx = tx + o.x * scale;
		var hy = ty + o.y * scale;

		img_hd.style.display = 'block';
		img_hd.style.width = hw + 'px';
		img_hd.style.height = hh + 'px';

	img_hd.style.transform =
		'translate(' + (hx + view.x) + 'px,' + (hy + view.y) + 'px)';
	}

	function next_img() {
		current_idx = (current_idx + 1) % img_list.length;
		img.src = img_list[current_idx];
		img_hd.style.display = 'none';
	}

	img.onload = fit_background;
	img_hd.onload = fit_background;
	window.addEventListener('resize', fit_background);
	
	
	
//mouse		##bug in zoom to pointer by wheel. pivot is not proper point of cursor
	var dragging = false;
	var last_x = 0;
	var last_y = 0;

	window.addEventListener('mousedown', function(e) {
		dragging = true;
		last_x = e.clientX;
		last_y = e.clientY;
	});

	window.addEventListener('mousemove', function(e) {
		if (!dragging) return;
		view.x += e.clientX - last_x;
		view.y += e.clientY - last_y;
		last_x = e.clientX;
		last_y = e.clientY;
		fit_background();
	});

	window.addEventListener('mouseup', function() {
		dragging = false;
	});

	window.addEventListener('wheel', function(e) {
		e.preventDefault();

		var zoom = e.deltaY < 0 ? 1.1 : 0.9;
		var old_scale = view.scale;

		view.scale *= zoom;
		view.scale = Math.min(view.max_scale, Math.max(1, view.scale));
		if (view.scale === old_scale) return;

		var mx = e.clientX;
		var my = e.clientY;

		// cursor position in IMAGE space
		var ix = (mx - view.x);
		var iy = (my - view.y);

		var ratio = view.scale / old_scale;

		view.x = mx - ix * ratio;
		view.y = my - iy * ratio;

		fit_background();
	}, { passive: false });
	
//✅ Touch pan + pinch zoom

	window.addEventListener('touchstart', function(e) {
		pointers = [...e.touches];
		if (pointers.length === 2) {
			last_dist = Math.hypot(
				pointers[0].clientX - pointers[1].clientX,
				pointers[0].clientY - pointers[1].clientY
			);
		}
	});

	window.addEventListener('touchmove', function(e) {
		e.preventDefault();
		var t = [...e.touches];

		if (t.length === 1 && pointers.length === 1) {
			view.x += t[0].clientX - pointers[0].clientX;
			view.y += t[0].clientY - pointers[0].clientY;
		}

		if (t.length === 2 && pointers.length === 2) {
			var dist = Math.hypot(
				t[0].clientX - t[1].clientX,
				t[0].clientY - t[1].clientY
			);

			var zoom = dist / last_dist;
			var old_scale = view.scale;

			view.scale = Math.min(
				view.max_scale,
				Math.max(view.min_scale, view.scale * zoom)
			);

			var cx = (t[0].clientX + t[1].clientX) * 0.5;
			var cy = (t[0].clientY + t[1].clientY) * 0.5;

			view.x = cx - (cx - view.x) * (view.scale / old_scale);
			view.y = cy - (cy - view.y) * (view.scale / old_scale);

			last_dist = dist;
		}

		pointers = t;
		fit_background();
	}, { passive: false });

	window.addEventListener('touchend', function(e) {
		pointers = [...e.touches];
	});
</script>


</body>
</html>
