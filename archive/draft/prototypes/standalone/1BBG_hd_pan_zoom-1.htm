<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport"
	      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

	<title>VN Background</title>

	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}

		/*
			Без JavaScript этот img всё равно будет отображён.
			При JavaScript он используется как основной фон.
		*/
		.background {
			position: fixed;
			top: 0;
			left: 0;
			display: block;
			transform-origin: 0 0;
			user-select: none;
			-webkit-user-drag: none;
			pointer-events: none;
			will-change: transform, width, height;
		}

		#bg {
			z-index: 1;
		}

		#bg_hd {
			z-index: 2;
		}

		button {
			position: fixed;
			right: 20px;
			bottom: 20px;
			z-index: 10;

			padding: 10px 20px;
			font-size: 16px;
			cursor: pointer;
			touch-action: manipulation;
		}

		/*
			Когда JavaScript работает, изображение занимает
			весь интерактивный экран.
		*/
		body.js-ready {
			touch-action: none;
		}
	</style>
</head>

<body>

	<!--
		Если JavaScript выключен, этот img всё равно будет виден.
		Можно заменить src на отдельный preview-файл.
	-->
	<img
		id="bg"
		class="background"
		src="../../fixtures/1.png"
		alt="VN background">

	<!-- Качественная область интереса -->
	<img
		id="bg_hd"
		class="background"
		alt=""
		aria-hidden="true">

	<button id="nextButton" type="button">Next</button>

<script>
document.body.classList.add('js-ready');

/*
	Описание областей.

	x, y, w, h — область интереса внутри базового изображения.
	hd — отдельное качественное изображение этой области.

	Важно:
	HD-файл должен содержать только область размером w × h
	в логических координатах базовой картинки. Его физическое
	разрешение может быть другим.
*/
var originals = {
	'../../fixtures/1.png': {
		x: 477,
		y: 239,
		w: 804,
		h: 1056,
		hd: '../../fixtures/1_c.png'
	}
};


/*
	Внутри view.scale хранится только относительный zoom:

	1 = исходный вид;
	2 = увеличение в два раза;
	4 = увеличение в четыре раза.

	Это НЕ размер картинки в пикселях.
*/
var view = {
	scale: 1,
	minScale: 1,
	maxScale: 4,

	// Дополнительное экранное смещение в пикселях
	x: 0,
	y: 0
};

var imageList = Object.keys(originals);
var currentIndex = 0;

var img = document.getElementById('bg');
var imgHd = document.getElementById('bg_hd');
var nextButton = document.getElementById('nextButton');

var dragging = false;
var lastPointerX = 0;
var lastPointerY = 0;

var activePointers = new Map();

var pinchStartDistance = 0;
var pinchStartScale = 1;


/* ------------------------------------------------------------
   Общие функции
------------------------------------------------------------ */

function getViewportSize() {
	return {
		width: document.documentElement.clientWidth,
		height: document.documentElement.clientHeight
	};
}

function clamp(value, min, max) {
	return Math.max(min, Math.min(max, value));
}

function getCurrentOriginal() {
	var src = img.getAttribute('src');

	if (!src) return null;

	/*
		Берём только имя файла, чтобы работало и с относительным,
		и с абсолютным URL.
	*/
	var fileName = src.split('/').pop();

	return originals[fileName] || null;
}

function getBaseLayout(original, scale) {
	var viewport = getViewportSize();

	/*
		Масштаб, при котором область interest:
		- полностью помещается в viewport;
		- занимает максимально возможный размер.
	*/
	var baseScale = Math.min(
		viewport.width / original.w,
		viewport.height / original.h
	);

	var finalScale = baseScale * scale;

	var imageWidth = img.naturalWidth * finalScale;
	var imageHeight = img.naturalHeight * finalScale;

	/*
		Центр области interest должен совпасть
		с центром viewport.
	*/
	var regionCenterX = original.x + original.w / 2;
	var regionCenterY = original.y + original.h / 2;

	var tx =
		viewport.width / 2 -
		regionCenterX * finalScale;

	var ty =
		viewport.height / 2 -
		regionCenterY * finalScale;

	return {
		viewportWidth: viewport.width,
		viewportHeight: viewport.height,

		baseScale: baseScale,
		scale: finalScale,

		width: imageWidth,
		height: imageHeight,

		tx: tx,
		ty: ty
	};
}


/*
	Ограничивает итоговую позицию изображения.

	Если изображение больше viewport, края не должны
	оставлять пустое место.

	Если изображение меньше viewport, оно центрируется.
*/
function clampImagePosition(position, imageSize, viewportSize) {
	if (imageSize <= viewportSize) {
		return (viewportSize - imageSize) / 2;
	}

	return clamp(
		position,
		viewportSize - imageSize,
		0
	);
}


/*
	Возвращает фактический итоговый layout
	с учётом pan и ограничения краёв.
*/
function getFinalLayout(original) {
	var layout = getBaseLayout(original, view.scale);

	var x = layout.tx + view.x;
	var y = layout.ty + view.y;

	x = clampImagePosition(
		x,
		layout.width,
		layout.viewportWidth
	);

	y = clampImagePosition(
		y,
		layout.height,
		layout.viewportHeight
	);

	return {
		viewportWidth: layout.viewportWidth,
		viewportHeight: layout.viewportHeight,

		baseScale: layout.baseScale,
		scale: layout.scale,

		width: layout.width,
		height: layout.height,

		x: x,
		y: y
	};
}


/* ------------------------------------------------------------
   Отрисовка базового изображения и HD-области
------------------------------------------------------------ */

function fitBackground() {
	if (!img.naturalWidth || !img.naturalHeight) {
		return;
	}

	var original = getCurrentOriginal();

	if (!original) {
		return;
	}

	var layout = getFinalLayout(original);

	/*
		Базовое изображение
	*/
	img.style.width = layout.width + 'px';
	img.style.height = layout.height + 'px';

	img.style.transform =
		'translate(' +
		layout.x + 'px,' +
		layout.y + 'px)';


	/*
		HD overlay
	*/
	if (!original.hd) {
		imgHd.style.display = 'none';
		return;
	}

	/*
		Загружаем новый HD-файл только при необходимости.
	*/
	if (imgHd.dataset.src !== original.hd) {
		imgHd.dataset.src = original.hd;
		imgHd.src = original.hd;
		imgHd.style.display = 'none';
	}

	/*
		Если HD ещё не загружен, базовое изображение
		уже продолжает отображаться.
	*/
	if (!imgHd.naturalWidth || !imgHd.naturalHeight) {
		return;
	}

	/*
		HD-область занимает ровно ту же логическую область,
		что x/y/w/h в базовом изображении.
	*/
	var hdWidth = original.w * layout.scale;
	var hdHeight = original.h * layout.scale;

	var hdX = layout.x + original.x * layout.scale;
	var hdY = layout.y + original.y * layout.scale;

	imgHd.style.width = hdWidth + 'px';
	imgHd.style.height = hdHeight + 'px';

	imgHd.style.transform =
		'translate(' +
		hdX + 'px,' +
		hdY + 'px)';

	imgHd.style.display = 'block';
}


/* ------------------------------------------------------------
   Zoom вокруг заданной экранной точки
------------------------------------------------------------ */

/*
	Это ключевая функция.

	После изменения масштаба точка изображения,
	находившаяся под screenX/screenY,
	останется под той же экранной точкой.
*/
function zoomAroundPoint(screenX, screenY, newScale) {
	var original = getCurrentOriginal();

	if (!original || !img.naturalWidth) {
		return;
	}

	var oldScale = view.scale;

	newScale = clamp(
		newScale,
		view.minScale,
		view.maxScale
	);

	if (newScale === oldScale) {
		return;
	}

	/*
		Текущий итоговый layout до zoom.
	*/
	var oldLayout = getFinalLayout(original);

	/*
		Координаты точки изображения под курсором
		в натуральных координатах базовой картинки.
	*/
	var imageX =
		(screenX - oldLayout.x) /
		oldLayout.scale;

	var imageY =
		(screenY - oldLayout.y) /
		oldLayout.scale;

	/*
		Временно считаем новый базовый layout
		без ручного pan.
	*/
	var newBaseLayout = getBaseLayout(
		original,
		newScale
	);

	/*
		Определяем, каким должен быть view.x/view.y,
		чтобы та же точка осталась под курсором.
	*/
	view.x =
		screenX -
		newBaseLayout.tx -
		imageX * newBaseLayout.scale;

	view.y =
		screenY -
		newBaseLayout.ty -
		imageY * newBaseLayout.scale;

	view.scale = newScale;

	fitBackground();
}


/* ------------------------------------------------------------
   Изображения
------------------------------------------------------------ */

function nextImage() {
	currentIndex =
		(currentIndex + 1) % imageList.length;

	/*
		Каждая новая картинка начинает
		с исходного положения.
	*/
	view.scale = 1;
	view.x = 0;
	view.y = 0;

	imgHd.style.display = 'none';
	imgHd.removeAttribute('src');
	imgHd.dataset.src = '';

	img.src = imageList[currentIndex];
}


/* ------------------------------------------------------------
   Mouse pan
------------------------------------------------------------ */

window.addEventListener('mousedown', function (event) {
	if (event.target === nextButton) {
		return;
	}

	dragging = true;

	lastPointerX = event.clientX;
	lastPointerY = event.clientY;
});

window.addEventListener('mousemove', function (event) {
	if (!dragging) {
		return;
	}

	view.x += event.clientX - lastPointerX;
	view.y += event.clientY - lastPointerY;

	lastPointerX = event.clientX;
	lastPointerY = event.clientY;

	fitBackground();
});

window.addEventListener('mouseup', function () {
	dragging = false;
});

window.addEventListener('mouseleave', function () {
	dragging = false;
});


/* ------------------------------------------------------------
   Mouse wheel zoom
------------------------------------------------------------ */

window.addEventListener('wheel', function (event) {
	event.preventDefault();

	/*
		Плавнее, чем фиксированные 1.1 и 0.9.
	*/
	var factor = Math.exp(-event.deltaY * 0.001);

	zoomAroundPoint(
		event.clientX,
		event.clientY,
		view.scale * factor
	);
}, {
	passive: false
});


/* ------------------------------------------------------------
   Touch / Pointer Events
------------------------------------------------------------ */

window.addEventListener('pointerdown', function (event) {
	if (event.target === nextButton) {
		return;
	}

	event.preventDefault();

	activePointers.set(event.pointerId, event);

	if (activePointers.size === 1) {
		dragging = true;

		lastPointerX = event.clientX;
		lastPointerY = event.clientY;
	}

	if (activePointers.size === 2) {
		dragging = false;

		var points = Array.from(activePointers.values());

		pinchStartDistance = Math.hypot(
			points[0].clientX - points[1].clientX,
			points[0].clientY - points[1].clientY
		);

		pinchStartScale = view.scale;
	}
});

window.addEventListener('pointermove', function (event) {
	if (!activePointers.has(event.pointerId)) {
		return;
	}

	event.preventDefault();

	activePointers.set(event.pointerId, event);

	var points = Array.from(activePointers.values());

	/*
		Один палец / мышь — pan.
	*/
	if (points.length === 1 && dragging) {
		var point = points[0];

		view.x += point.clientX - lastPointerX;
		view.y += point.clientY - lastPointerY;

		lastPointerX = point.clientX;
		lastPointerY = point.clientY;

		fitBackground();
		return;
	}

	/*
		Два пальца — pinch zoom.
	*/
	if (points.length === 2 && pinchStartDistance > 0) {
		var p1 = points[0];
		var p2 = points[1];

		var currentDistance = Math.hypot(
			p1.clientX - p2.clientX,
			p1.clientY - p2.clientY
		);

		var pinchFactor =
			currentDistance / pinchStartDistance;

		var newScale =
			pinchStartScale * pinchFactor;

		var centerX =
			(p1.clientX + p2.clientX) / 2;

		var centerY =
			(p1.clientY + p2.clientY) / 2;

		zoomAroundPoint(
			centerX,
			centerY,
			newScale
		);
	}
});

window.addEventListener('pointerup', function (event) {
	activePointers.delete(event.pointerId);

	if (activePointers.size === 0) {
		dragging = false;
		pinchStartDistance = 0;
	}
});

window.addEventListener('pointercancel', function (event) {
	activePointers.delete(event.pointerId);

	if (activePointers.size === 0) {
		dragging = false;
		pinchStartDistance = 0;
	}
});


/* ------------------------------------------------------------
   Events
------------------------------------------------------------ */

img.addEventListener('load', function () {
	/*
		После смены базового изображения нужно
		пересчитать его положение.
	*/
	fitBackground();
});

imgHd.addEventListener('load', function () {
	fitBackground();
});

nextButton.addEventListener('click', nextImage);

window.addEventListener('resize', function () {
	fitBackground();
});

if (window.visualViewport) {
	window.visualViewport.addEventListener(
		'resize',
		fitBackground
	);
}


/*
	Если изображение уже было в кеше,
	load мог произойти до установки обработчика.
*/
if (img.complete && img.naturalWidth) {
	fitBackground();
}
</script>

</body>
</html>
