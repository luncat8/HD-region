<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VN Background</title>
<style>
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}
	html, body {
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #000;
	}
	.background {
		position: fixed;
		inset: 0;
		transform-origin: 0 0;
		will-change: transform;
	}
	
	button {
		position: fixed;
		bottom: 20px;
		right: 20px;
		z-index: 10;
	}
</style>

</head>
<body>
<img id="bg" class="background" src="1.png">
<img id="bg_hd" class="background">

<button onclick="next_img()">Next</button>



<script>
	var originals = {
		'1.png': { x: 512, y: 256, w: 768, h: 1024, hd:'1hd.png' },//add hd image for original region (it may be any resolution and if available - draw it in place of calculated position. Use case - keep 1.png very compressed small size, but if availble - draw over it 1hd.png with good quality.  )
		'2.png': { x: 512, y: 0, w: 768, h: 1024 },
		'3.png': { x: 173, y: 182, w: 610, h: 610 },
	};

	var img_list = Object.keys(originals);
	var current_idx = 0;
	var img = document.getElementById('bg');

	function fit_background() {
		if (!img.naturalWidth) return;

		var src = img.src.split('/').pop();
		var o = originals[src];
		if (!o) return;

		var vw = document.documentElement.clientWidth;
		var vh = document.documentElement.clientHeight;

		// scale so ORIGINAL REGION fits screen (contain)
		var scale = Math.min(
			vw / o.w,
			vh / o.h
		);

		var scaled_w = img.naturalWidth * scale;
		var scaled_h = img.naturalHeight * scale;

		// desired offset to center original region
		var tx = vw * 0.5 - (o.x + o.w * 0.5) * scale;
		var ty = vh * 0.5 - (o.y + o.h * 0.5) * scale;

		// clamp if image smaller than screen (avoid empty gaps)
		if (scaled_w > vw) {
			tx = Math.min(0, Math.max(vw - scaled_w, tx));
		} else {
			tx = (vw - scaled_w) * 0.5;
		}

		if (scaled_h > vh) {
			ty = Math.min(0, Math.max(vh - scaled_h, ty));
		} else {
			ty = (vh - scaled_h) * 0.5;
		}

		img.style.width = scaled_w + 'px';
		img.style.height = scaled_h + 'px';
		img.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';
	}

	function next_img() {
		current_idx = (current_idx + 1) % img_list.length;
		img.src = img_list[current_idx];
	}

	img.onload = fit_background;
	window.addEventListener('resize', fit_background);
</script>

</body>
</html>
