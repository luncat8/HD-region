<svg
    xmlns="http://www.w3.org/2000/svg"
    xmlns:xlink="http://www.w3.org/1999/xlink"
    viewBox="0 0 2048 1536"
    width="2048"
    height="1536">

    <!-- фоновое изображение сцены -->
    <image
        id="bg"
        x="0"
        y="0"
        width="2048"
        height="1536"
        xlink:href="../img/3.avif" />
    <image
        id="bg"
        x="512"
        y="256"
        width="768"
        height="1024"
        xlink:href="../img/3_c.avif" />
		
    <!-- HD регион (камера фокуса) -->
    <rect
        id="hd"
        x="512"
        y="256"
        width="768"
        height="1024"
        data-hd="../img/3_c.avif"
        fill="none"
        stroke="red"
        stroke-width="6" />
</svg>


