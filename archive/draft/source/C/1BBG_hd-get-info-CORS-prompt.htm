
//такое описание фоновой картинки с более четким регионом. 
переделать в svg, чтобы вынести отсюда описание координат во внешний svg файл и в то же время избежать CORS
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VN Background</title>
<style>
	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
	}
	html, body {
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: #000;
		font-size:2em;
	}
.background {
	position: fixed;
	inset: 0;
	transform-origin: 0 0;
	will-change: transform;
	pointer-events: none;
}
#bg_hd {
	z-index: 2;
}
	
	button {
		position: fixed;
		bottom: 20px;
		right: 20px;
		z-index: 10;
	}
</style>

</head>
<body>
<button onclick="next_img()">Next</button>


<img id="bg" class="background" src="1.png">
<img id="bg_hd" class="background">



<script>

	var originals = {
		'3.avif': { x: 476, y: 101, w: 1016, h: 900, hd: '3_c.avif' }, //'3_c.avif' central region, position and size of it.  '3.avif' is outpaited image
		'1.png': { x: 512, y: 256, w: 768, h: 1024, hd: '3_c.webp' },
		'2.png': { x: 512, y: 0, w: 768, h: 1024 }
	};

	var img_list = Object.keys(originals);
	var current_idx = 0;

	var img = document.getElementById('bg');
	var img_hd = document.getElementById('bg_hd');

	function fit_background() {
		if (!img.naturalWidth) return;

		var src = img.src.split('/').pop();
		var o = originals[src];
		if (!o) return;

		var vw = document.documentElement.clientWidth;
		var vh = document.documentElement.clientHeight;

		var scale = Math.min(vw / o.w, vh / o.h);

		var bw = img.naturalWidth * scale;
		var bh = img.naturalHeight * scale;

		var tx = vw * 0.5 - (o.x + o.w * 0.5) * scale;
		var ty = vh * 0.5 - (o.y + o.h * 0.5) * scale;

		if (bw > vw) tx = Math.min(0, Math.max(vw - bw, tx));
		else tx = (vw - bw) * 0.5;

		if (bh > vh) ty = Math.min(0, Math.max(vh - bh, ty));
		else ty = (vh - bh) * 0.5;

		img.style.width = bw + 'px';
		img.style.height = bh + 'px';
		img.style.transform = 'translate(' + tx + 'px,' + ty + 'px)';

		// ---- HD overlay ----
		if (!o.hd) {
			img_hd.style.display = 'none';
			return;
		}

		if (img_hd.src.indexOf(o.hd) === -1) {
			img_hd.src = o.hd;
		}

		if (!img_hd.naturalWidth) return;

		var hw = o.w * scale;
		var hh = o.h * scale;

		var hx = tx + o.x * scale;
		var hy = ty + o.y * scale;

		img_hd.style.display = 'block';
		img_hd.style.width = hw + 'px';
		img_hd.style.height = hh + 'px';
		img_hd.style.transform = 'translate(' + hx + 'px,' + hy + 'px)';
	}

	function next_img() {
		current_idx = (current_idx + 1) % img_list.length;
		img.src = img_list[current_idx];
		img_hd.style.display = 'none';
	}

	img.onload = fit_background;
	img_hd.onload = fit_background;
	window.addEventListener('resize', fit_background);
</script>


</body>
</html>
