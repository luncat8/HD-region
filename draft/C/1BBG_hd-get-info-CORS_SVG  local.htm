<svg id="scene" viewBox="0 0 2048 1536" width="2048" height="1536">
    <image id="bg" href="img/3.avif" x="0" y="0" width="2048" height="1536" />
    <image id="bg_hd" href="img/3_c.avif" x="512" y="256" width="768" height="1024" visibility="hidden" />
</svg>

<script>
//const scenes = [
//   { bg: 'images/bg1.png', hd: 'images/bg1_hd.webp', x:512, y:256, w:768, h:1024 }
//];

let current = 0;
const svg = document.getElementById('scene');
const bg = document.getElementById('bg');
const bg_hd = document.getElementById('bg_hd');

function fitBackground() {
    const s = scenes[current];
    if (!s) return;

    const vw = window.innerWidth;
    const vh = window.innerHeight;

    const scale = Math.min(vw / s.w, vh / s.h);

    const bw = 2048 * scale; // ширина исходного bg
    const bh = 1536 * scale; // высота исходного bg

    let tx = vw/2 - (s.x + s.w/2)*scale;
    let ty = vh/2 - (s.y + s.h/2)*scale;

    if (bw > vw) tx = Math.min(0, Math.max(vw - bw, tx)); else tx = (vw - bw)/2;
    if (bh > vh) ty = Math.min(0, Math.max(vh - bh, ty)); else ty = (vh - bh)/2;

    bg.setAttribute('width', bw);
    bg.setAttribute('height', bh);
    bg.setAttribute('x', tx);
    bg.setAttribute('y', ty);

    bg_hd.setAttribute('width', s.w * scale);
    bg_hd.setAttribute('height', s.h * scale);
    bg_hd.setAttribute('x', tx + s.x*scale);
    bg_hd.setAttribute('y', ty + s.y*scale);
    bg_hd.setAttribute('visibility', 'visible');
}

function nextScene() {
    current = (current + 1) % scenes.length;
    bg_hd.setAttribute('visibility','hidden');
    fitBackground();
}

window.addEventListener('resize', fitBackground);
window.addEventListener('load', fitBackground);
</script>
