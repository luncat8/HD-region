<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>VN Background</title>
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		html, body {
			width: 100%;
			height: 100%;
			overflow: hidden;
			background: #000;
		}
		.background {
			position: absolute;
			top: 50%;
			left: 50%;
			/* transform-origin: center center; is not strictly necessary for translate,
			   but it doesn't hurt and would be important for scale/rotate if added later. */
			transform-origin: center center;
			/* Ensure smooth transitions if dimensions or transforms change */
			transition: width 0.1s ease-out, height 0.1s ease-out, transform 0.1s ease-out;
		}
		button {
			position: fixed;
			bottom: 20px;
			right: 20px;
			z-index: 100;
			padding: 10px 20px;
			font-size: 16px;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<img id="bg" src="1.png" class="background">
	<button onclick="nextImg()">Next</button>

	<script>
	// Original region data for each image.
	// img.naturalWidth / img.naturalHeight represent the full image dimensions.
	// The 'original region' ({x, y, w, h}) is a sub-rectangle within the full image
	// that needs to be kept visible on screen, scaled up or down, while maintaining its aspect ratio.
	// This achieves a similar effect to CSS object-fit: contain, but for a specific sub-region.
	var originals = {};
	
	originals['1.png'] = { x: 512, y: 256, w: 768, h: 1024 }; // Example image '1.png' region 768x1024 must keep aspect ratio and fit into window, properly scaled in any resolution and aspect of screen. Use whole image size properly to best use outpainted region: by default keep original region centered but if there is no enought pixels in whole image - move original region to position that maximum cover screen with whole image. For example { x: 512, y: 0, w: 768, h: 768 } this image has original region on top of image, this mean we need keep original region on top to cover rest images with ret pixels of image if available, if not available such naturalHeight - keep centered remains part. Probably o not good describe so think how it should be to view good: priority task make original region in max size and secondary task other parts as much as possible
	originals['2.png'] = { x: 173, y: 182, w: 610, h: 610 }; // Example image '2.png'

	const imgList = Object.keys(originals);
	let currentIdx = 0;

	function fitBackground() {
		const img = document.getElementById('bg');
		const imgSrc = img.src.split('/').pop();
		const origRegion = originals[imgSrc];
		
		// Exit if original region data is missing or image natural dimensions are not available.
		// naturalWidth/naturalHeight can be 0 if the image hasn't loaded yet or is invalid.
		if (!origRegion || !img.naturalWidth || !img.naturalHeight) {
			return;
		}
		
		const viewportWidth = window.innerWidth;
		const viewportHeight = window.innerHeight;
		
		const origRegionAspectRatio = origRegion.w / origRegion.h;
		const viewportAspectRatio = viewportWidth / viewportHeight;
		
		let scale;
		// Determine the scaling factor to 'contain' the original region within the viewport.
		if (viewportAspectRatio > origRegionAspectRatio) {
			// If the viewport is relatively wider than the original region,
			// scale the image so that the original region's height fills the viewport height.
			scale = viewportHeight / origRegion.h;
		} else {
			// If the viewport is relatively taller or has the same aspect ratio as the original region,
			// scale the image so that the original region's width fills the viewport width.
			scale = viewportWidth / origRegion.w;
		}
		
		// Calculate the full image's dimensions after applying the determined scale.
		// These will be the `width` and `height` properties of the `<img>` element.
		const imgScaledWidth = img.naturalWidth * scale;
		const imgScaledHeight = img.naturalHeight * scale;
		
		// Calculate the center point of the original region in the image's *natural* (unscaled) coordinate system.
		const origRegionCenterX = origRegion.x + origRegion.w / 2;
		const origRegionCenterY = origRegion.y + origRegion.h / 2;
		
		// Calculate the `translateX` and `translateY` values needed for the CSS transform.
		//
		// The CSS `top: 50%; left: 50%;` initially positions the image element's top-left at:
		// `(viewportWidth / 2 - imgScaledWidth / 2, viewportHeight / 2 - imgScaledHeight / 2)`.
		//
		// We want the scaled center of the original region
		// (which is at `(origRegionCenterX * scale, origRegionCenterY * scale)` relative to the scaled image's top-left)
		// to align with the viewport's center `(viewportWidth / 2, viewportHeight / 2)`.
		//
		// Let `currentImgX` and `currentImgY` be the initial top-left position of the image element
		// after `top: 50%; left: 50%;`.
		// `currentImgX = viewportWidth / 2 - imgScaledWidth / 2`
		// `currentImgY = viewportHeight / 2 - imgScaledHeight / 2`
		//
		// The `translateX` and `translateY` values will then adjust this position:
		// The final absolute X position of the scaled original region's center is:
		// `finalX = currentImgX + translateX + (origRegionCenterX * scale)`
		// We want `finalX = viewportWidth / 2`.
		// `viewportWidth / 2 = (viewportWidth / 2 - imgScaledWidth / 2) + translateX + (origRegionCenterX * scale)`
		// `0 = - imgScaledWidth / 2 + translateX + (origRegionCenterX * scale)`
		// `translateX = (imgScaledWidth / 2) - (origRegionCenterX * scale)`
		//
		// Similarly for `translateY`:
		// `translateY = (imgScaledHeight / 2) - (origRegionCenterY * scale)`
		
		const translateX = (imgScaledWidth / 2) - (origRegionCenterX * scale);
		const translateY = (imgScaledHeight / 2) - (origRegionCenterY * scale);
		
		// Apply the calculated dimensions and transform.
		img.style.width = `${imgScaledWidth}px`;
		img.style.height = `${imgScaledHeight}px`;
		img.style.transform = `translate(${translateX}px, ${translateY}px)`;
	}

	function nextImg() {
		currentIdx = (currentIdx + 1) % imgList.length;
		const img = document.getElementById('bg');
		img.src = imgList[currentIdx]; // Changing src triggers the 'onload' event for the new image.
	}

	const bgImg = document.getElementById('bg');
	bgImg.onload = fitBackground; // Recalculate and apply styling when a new image finishes loading.
	window.addEventListener('resize', fitBackground); // Recalculate on window resize to adapt to viewport changes.
	
	// If the image is already in the browser cache, `onload` might not fire.
	// In such cases, explicitly call `fitBackground` after the script runs to ensure initial positioning.
	// `bgImg.naturalWidth` check ensures the image data is actually available.
	if (bgImg.complete && bgImg.naturalWidth) {
		fitBackground();
	}
	</script>
</body>
</html>
